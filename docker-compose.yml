services:
  db:
    image: postgres:17-alpine
    container_name: economiza-agora-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-economiza_agora}
      POSTGRES_USER: ${POSTGRES_USER:-economiza}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-economiza}
    ports:
      - "${POSTGRES_PORT:-55433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-economiza} -d ${POSTGRES_DB:-economiza_agora}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
