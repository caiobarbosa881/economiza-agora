name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Instala dependências
        run: pip install -r requirements-dev.txt
      - name: Ruff check
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Instala dependências
        run: pip install -r requirements-dev.txt
      - name: Valida schema OpenAPI
        run: python manage.py spectacular --settings config.settings.test --validate --fail-on-warn --file openapi.yaml
      - name: Executa testes
        run: pytest

  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: economiza_agora
          POSTGRES_USER: economiza
          POSTGRES_PASSWORD: economiza
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U economiza -d economiza_agora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_DB: economiza_agora
      POSTGRES_USER: economiza
      POSTGRES_PASSWORD: economiza
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Instala dependências
        run: pip install -r requirements-dev.txt
      - name: Verifica migrações pendentes
        run: python manage.py makemigrations --check --dry-run --settings config.settings.test_postgres
      - name: Executa testes no PostgreSQL
        run: pytest --ds=config.settings.test_postgres
